<!-- Build a Product Gallery that dynamically displays products from a JSON dataset using cards and includes a “Buy Now” interaction. -->
<!doctype html>
<html>
  <head>
    <title>Photo Gallery</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
      }

      .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      .img-box {
        width: 150px;
        height: 150px;
        margin: 10px;
        overflow: hidden; /* important for zoom */
      }

      img {
        width: 100%;
        height: 100%;
        transition: 0.3s;
      }

      .img-box:hover img {
        transform: scale(1.2); /* zoom effect */
      }
    </style>
  </head>
