<!-- Design a Responsive Navigation Bar with at least one dropdown menu using HTML, CSS, and JavaScript. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .nav {
      background: #222;
      color: white;
      display: flex;
      flex-wrap: wrap; /* Allows menu to wrap below toggle on mobile */
      align-items: center;
      padding: 0 20px;
    }

    /* Brand/Logo Area */
    .brand {
      padding: 15px 0;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .menu {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      margin-left: auto; /* Pushes menu to the right on desktop */
    }

    .menu a {
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      display: block;
      transition: background 0.3s;
    }

    .menu a:hover {
      background: #444;
    }

    /* Dropdown Logic */
    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: #333;
      top: 100%;
      left: 0;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 10;
    }

    /* Desktop Hover Trigger */
    @media (min-width: 601px) {
      .dropdown:hover .dropdown-content {
        display: block;
      }
    }

    .toggle {
      display: none;
      margin-left: auto;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 10px;
    }

    /* MOBILE VIEW (< 600px) */
    @media (max-width: 600px) {
      .toggle {
        display: block;
      }

      .menu {
        display: none; /* Hidden by default */
        width: 100%;
        flex-direction: column;
        border-top: 1px solid #444;
      }

      .menu.show {
        display: flex; /* Shown when toggled */
      }

      .dropdown-content {
        position: static; /* Stack inside the menu */
        background: #444;
        width: 100%;
      }

      .dropdown-content.show-drop {
        display: block;
      }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="brand">MyWebsite</div>
  <span class="toggle" onclick="toggleMenu()">☰</span>

  <div class="menu" id="navMenu">
    <a href="#">Home</a>
    <a href="#">About</a>

    <div class="dropdown">
      <a href="javascript:void(0)" onclick="toggleDropdown()">Services ▼</a>
      <div class="dropdown-content" id="servicesDrop">
        <a href="#">Web Design</a>
        <a href="#">App Dev</a>
        <a href="#">SEO</a>
      </div>
    </div>
    
    <a href="#">Contact</a>
  </div>
</nav>

<script>
  function toggleMenu() {
    const menu = document.getElementById("navMenu");
    menu.classList.toggle("show");
  }

  function toggleDropdown() {
    // Only toggle via click if we are on a small screen
    if (window.innerWidth <= 600) {
      const drop = document.getElementById("servicesDrop");
      drop.classList.toggle("show-drop");
    }
  }
</script>

</body>
</html>
