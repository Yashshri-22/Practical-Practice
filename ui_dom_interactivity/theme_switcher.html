<!-- Implement a Theme Switcher that allows users to toggle between Dark and Light modes, with preference stored using localStorage. -->
<!doctype html>
<html>
  <head>
    <title>Theme Switcher</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
        transition: 0.3s;
      }

      .dark {
        background: black;
        color: white;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 30px;
      }

      .switch input {
        display: none;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        background: gray;
        border-radius: 30px;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        transition: 0.4s;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 24px;
        width: 24px;
        background: white;
        border-radius: 50%;
        left: 3px;
        top: 3px;
        transition: 0.4s;
      }

      input:checked + .slider {
        background: black;
      }

      input:checked + .slider::before {
        transform: translateX(30px);
      }

      /* dark mode styling */
      .dark .slider {
        background: black;
      }

      .dark input:checked + .slider {
        background: #ffffff; /* green looks nice */
      }

      .dark .slider::before {
        background: rgb(0, 0, 0);
      }
    </style>
  </head>

  <body>
    <h2>Theme Switcher</h2>
    <label class="switch">
      <input type="checkbox" id="themeToggle" onchange="toggleTheme(this)" />
      <span class="slider"></span>
    </label>

    <p id="mode">Light Mode</p>
    <script>
      // load saved theme
      let toggle = document.getElementById("themeToggle");

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggle.checked = true;
        document.getElementById("mode").innerText = "Dark Mode";
      }

      function toggleTheme(el) {
        document.body.classList.toggle("dark");

        if (el.checked) {
          localStorage.setItem("theme", "dark");
          document.getElementById("mode").innerText = "Dark Mode";
        } else {
          localStorage.setItem("theme", "light");
          document.getElementById("mode").innerText = "Light Mode";
        }
      }
    </script>
  </body>
</html>
