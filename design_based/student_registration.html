<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    
    .reg-form {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h2 { text-align: center; color: #333; }

    /* Space out every form group */
    .field { margin-bottom: 15px; }

    label { display: block; margin-bottom: 5px; font-weight: bold; }

    /* Universal styling for text, email, select, and textarea */
    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box; /* Ensures padding doesn't affect width */
    }

    /* Radio button layout */
    .radio-group { display: flex; gap: 15px; }
    .radio-group label { font-weight: normal; }

    button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { background: #218838; }
  </style>
</head>
<body>

<div class="reg-form">
  <h2>Student Registration</h2>
  
  <form onsubmit="handleSubmit(event)">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
    </div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="name@example.com" required>
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div>
    </div>

    <div class="field">
      <label>Course</label>
      <select id="course" required>
        <option value="">-- Select Course --</option>
        <option value="CS">Computer Science</option>
        <option value="IT">Information Technology</option>
        <option value="EE">Electrical Engineering</option>
      </select>
    </div>

    <div class="field">
      <label>Address</label>
      <textarea id="address" rows="3" placeholder="Enter your full address"></textarea>
    </div>

    <button type="submit">Register Now</button>
  </form>
</div>

<script>
  function handleSubmit(e) {
    e.preventDefault(); // Prevents page refresh
    alert("Registration Successful!");
    // You can console.log the values here to show you know how to extract data
    let name = document.getElementById('name').value;
    console.log("Registered Name: " + name);
  }
</script>

</body>
</html>
