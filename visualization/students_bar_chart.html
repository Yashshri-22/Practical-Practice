<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Enrollment Bar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      max-width: 600px;
      margin: 50px auto;
    }
  </style>
</head>
<body>

  <h2>Student Enrollment by Department</h2>

  <!-- Chart Canvas -->
  <canvas id="barChart"></canvas>

  <script>
    const ctx = document.getElementById('barChart').getContext('2d');

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['CS', 'IT', 'ME', 'EE', 'Civil'],
        datasets: [{
          label: 'Number of Students',
          data: [120, 100, 95, 80, 70],
          backgroundColor: '#007bff'
        }]
      },
      options: {
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>

</body>
</html>
