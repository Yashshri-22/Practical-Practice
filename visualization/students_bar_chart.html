<!-- Create a Bar Chart to visualize the number of students in different departments using static data. -->

<!DOCTYPE html>
<html>
<head>
  <title>Student Bar Chart</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    
    .chart-container {
      display: flex;
      align-items: flex-end; /* Align bars to bottom */
      justify-content: center;
      gap: 20px;
      height: 300px;
      padding: 20px;
      border-left: 2px solid #333;
      border-bottom: 2px solid #333;
      max-width: 600px;
      margin: 50px auto;
    }

    .bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bar {
      width: 50px;
      background: #007bff;
      transition: background 0.3s;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: white;
      font-size: 12px;
      padding-top: 5px;
    }

    .bar:hover { background: #0056b3; }
    
    .label {
      margin-top: 10px;
      font-size: 12px;
      transform: rotate(-45deg);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h2>Student Enrollment by Department</h2>

  <div class="chart-container">
    <div class="bar-wrapper">
      <div class="bar" style="height: 240px;">120</div>
      <div class="label">CS</div>
    </div>

    <div class="bar-wrapper">
      <div class="bar" style="height: 200px;">100</div>
      <div class="label">IT</div>
    </div>

    <div class="bar-wrapper">
      <div class="bar" style="height: 190px;">95</div>
      <div class="label">ME</div>
    </div>

    <div class="bar-wrapper">
      <div class="bar" style="height: 160px;">80</div>
      <div class="label">EE</div>
    </div>

    <div class="bar-wrapper">
      <div class="bar" style="height: 140px;">70</div>
      <div class="label">Civil</div>
    </div>
  </div>

</body>
</html>
