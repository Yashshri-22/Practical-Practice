<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Doughnut Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f4f4f4;
    }
    canvas {
      max-width: 300px;
      margin: 40px auto;
    }
  </style>
</head>
<body>

  <h2>Attendance Overview (June 2026)</h2>

  <!-- Chart Canvas -->
  <canvas id="attendanceChart"></canvas>

  <script>
    const ctx = document.getElementById('attendanceChart').getContext('2d');

    const attendanceChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Present', 'Absent', 'Leave'],
        datasets: [{
          data: [75, 15, 10],
          backgroundColor: [
            '#28a745', // Present (green)
            '#dc3545', // Absent (red)
            '#ffc107'  // Leave (yellow)
          ],
          borderWidth: 1
        }]
      },
      options: {
        cutout: '70%', // Creates doughnut hole
        plugins: {
          legend: {
            position: 'bottom'
          },
          tooltip: {
            enabled: true
          }
        }
      }
    });
  </script>

</body>
</html>
