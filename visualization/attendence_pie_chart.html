<!-- Design a Pie or Doughnut Chart to represent attendance distribution (Present, Absent, Leave). -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Doughnut Chart</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    
    /* The core chart container */
    .doughnut {
      width: 250px;
      height: 250px;
      border-radius: 50%; /* Makes it a circle */
      margin: 40px auto;
      
      /* THIS IS THE CRITICAL LINE FOR THE EXAM */
      /* conic-gradient creates the pie segments */
      background: conic-gradient(
        #28a745 0deg 270deg,     /* Present (75% = 270deg) */
        #dc3545 270deg 324deg,   /* Absent  (15% = 54deg)  */
        #ffc107 324deg 360deg    /* Leave   (10% = 36deg)  */
      );
      
      /* Setup for central label */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* The 'hole' in the doughnut that shows the total */
    .doughnut-hole {
      width: 170px;
      height: 170px;
      background-color: #f4f4f4;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-weight: bold;
    }

    /* Legend styling */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      list-style: none;
      padding: 0;
    }
    .legend li { display: flex; align-items: center; }
    .dot { 
      height: 12px; width: 12px; 
      border-radius: 50%; display: inline-block; 
      margin-right: 8px; 
    }
  </style>
</head>
<body style="background-color: #f4f4f4;">

  <h2>Attendance Overview (June 2026)</h2>

  <div class="doughnut">
    <div class="doughnut-hole">
      <span style="font-size: 2.5rem; color: #333;">75%</span>
      <span style="font-size: 0.9rem; color: #666;">Present</span>
    </div>
  </div>

  <ul class="legend">
    <li><span class="dot" style="background: #28a745;"></span> Present (75%)</li>
    <li><span class="dot" style="background: #dc3545;"></span> Absent (15%)</li>
    <li><span class="dot" style="background: #ffc107;"></span> Leave (10%)</li>
  </ul>

</body>
</html>
