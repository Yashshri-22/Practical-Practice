<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard (Chart.js)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f0f4f8;
      padding: 40px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      height: 320px;
    }

    h2 {
      color: #333;
      font-size: 1.1rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    canvas {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1 style="text-align:center;">Weather Analytics Dashboard</h1>

<div class="dashboard">

  <!-- BAR CHART -->
  <div class="card">
    <h2>Weekly Temperature (°C)</h2>
    <canvas id="barChart"></canvas>
  </div>

  <!-- LINE (AREA) CHART -->
  <div class="card">
    <h2>Humidity Trends (%)</h2>
    <canvas id="lineChart"></canvas>
  </div>

  <!-- PIE CHART -->
  <div class="card">
    <h2>Weather Conditions</h2>
    <canvas id="pieChart"></canvas>
  </div>

</div>

<script>
  // BAR CHART (Temperature)
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
      datasets: [{
        label: 'Temperature °C',
        data: [28, 32, 26, 36, 30],
        backgroundColor: '#ff7e5f'
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });

  // LINE CHART (Humidity)
  new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
      datasets: [{
        label: 'Humidity %',
        data: [65, 70, 60, 75, 68],
        fill: true,
        tension: 0.4,
        backgroundColor: 'rgba(54, 162, 235, 0.2)',
        borderColor: '#36a2eb'
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });

  // PIE CHART (Weather Conditions)
  new Chart(document.getElementById('pieChart'), {
    type: 'pie',
    data: {
      labels: ['Sunny', 'Cloudy', 'Rainy'],
      datasets: [{
        data: [60, 30, 10],
        backgroundColor: ['#ffce56', '#36a2eb', '#ff6384']
      }]
    },
    options: {
      plugins: {
        legend: { position: 'bottom' }
      }
    }
  });
</script>

</body>
</html>
