<!-- Develop a Basic Calculator that performs addition, subtraction, multiplication, and division operations. -->

<!DOCTYPE html>
<html>
<head>
  <title>Basic Calculator</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    input { width: 50px; padding: 5px; margin: 5px; }
    button { padding: 5px 15px; cursor: pointer; }
    #result { color: blue; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Simple Calculator</h2>
  
  <input type="number" id="num1" placeholder="N1">
  <input type="number" id="num2" placeholder="N2">
  <br>

  <button onclick="calc('+')">+</button>
  <button onclick="calc('-')">-</button>
  <button onclick="calc('*')">*</button>
  <button onclick="calc('/')">/</button>

  <h3>Result: <span id="result">0</span></h3>

  <script>
    function calc(op) {
      // 1. Get values and convert to numbers
      let n1 = parseFloat(document.getElementById('num1').value);
      let n2 = parseFloat(document.getElementById('num2').value);
      let res = 0;

      // 2. Logic (Switch is easiest to remember)
      switch(op) {
        case '+': res = n1 + n2; break;
        case '-': res = n1 - n2; break;
        case '*': res = n1 * n2; break;
        case '/': 
          res = n2 !== 0 ? n1 / n2 : "Error (Div by 0)"; 
          break;
      }

      // 3. Display
      document.getElementById('result').innerText = res;
    }
  </script>

</body>
</html>
